org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# The Kotlin incremental caches in `build/*/kotlin/.../caches-jvm` fail to
# close on this machine ("Could not close incremental caches:
# class-fq-name-to-source.tab, ..."), which fails :share_plus and
# :shared_preferences_android:compileDebugKotlin and takes the whole APK down
# with it. Same cause as Kara's note: the pub cache lives on another drive
# (E:\pub-cache) than this workspace, and Kotlin's incremental cache does not
# survive sources and caches on different roots. Deleting the caches and
# stopping every Gradle daemon does not help, so the cache is bypassed.
kotlin.incremental=false
