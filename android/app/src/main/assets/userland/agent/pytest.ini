[pytest]
# The async tests in here (test_protocol.py) are plain `async def` functions
# carrying no asyncio marker. Without this setting pytest collects them but
# never executes them, reporting "async def functions are not natively
# supported" -- 2 failures that read like real regressions but are only a
# missing plugin configuration.
#
# The suite therefore only went green on a machine that happened to have
# pytest-asyncio installed AND was passed --asyncio-mode=auto. Neither was
# declared anywhere, so a fresh clone (or CI) could not run it as committed.
#
# Requires: pip install pytest-asyncio
asyncio_mode = auto
