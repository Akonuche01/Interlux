name: interlux
description: "A modern terminal for Android."
publish_to: 'none'
version: 0.8.0+18

environment:
  sdk: ^3.13.0

dependencies:
  xterm: ^4.0.0
  shared_preferences: ^2.5.3
  share_plus: ^11.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - agent/
    - agent/providers/
    - agent/tools/
    - agent/plugins/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Variable.ttf
